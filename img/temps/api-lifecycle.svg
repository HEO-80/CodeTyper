<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08080f"/>
      <stop offset="100%" style="stop-color:#0d0d1f"/>
    </linearGradient>
    <linearGradient id="laneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" style="stop-color:#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr1" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3df5ff"/>
    </marker>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7effa0"/>
    </marker>
    <marker id="arr3" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="url(#bg2)" rx="16"/>
  <pattern id="dots2" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#ffffff" opacity="0.035"/>
  </pattern>
  <rect width="800" height="480" fill="url(#dots2)" rx="16"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#3df5ff" filter="url(#glow2)" letter-spacing="0.1em">API REQUEST LIFECYCLE</text>
  <text x="400" y="55" text-anchor="middle" font-size="9" fill="#444466" letter-spacing="0.18em">QUIZ-API · SPRING BOOT · REQUEST → CONTROLLER → SERVICE → REPOSITORY → DB</text>
  <line x1="150" y1="63" x2="650" y2="63" stroke="#3df5ff" stroke-width="0.5" opacity="0.25"/>

  <!-- Lane headers -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.1s" fill="freeze"/>
    <rect x="30" y="75" width="110" height="30" rx="6" fill="url(#laneGrad)" stroke="#3df5ff" stroke-width="1" stroke-opacity="0.4"/>
    <text x="85" y="95" text-anchor="middle" font-size="10" fill="#3df5ff" letter-spacing="0.08em">CLIENT</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.25s" fill="freeze"/>
    <rect x="160" y="75" width="120" height="30" rx="6" fill="url(#laneGrad)" stroke="#ffca3a" stroke-width="1" stroke-opacity="0.4"/>
    <text x="220" y="95" text-anchor="middle" font-size="10" fill="#ffca3a" letter-spacing="0.08em">FILTER/SEC</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
    <rect x="300" y="75" width="120" height="30" rx="6" fill="url(#laneGrad)" stroke="#7effa0" stroke-width="1" stroke-opacity="0.4"/>
    <text x="360" y="95" text-anchor="middle" font-size="10" fill="#7effa0" letter-spacing="0.08em">CONTROLLER</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/>
    <rect x="440" y="75" width="120" height="30" rx="6" fill="url(#laneGrad)" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4"/>
    <text x="500" y="95" text-anchor="middle" font-size="10" fill="#a78bfa" letter-spacing="0.08em">SERVICE</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/>
    <rect x="580" y="75" width="120" height="30" rx="6" fill="url(#laneGrad)" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="640" y="95" text-anchor="middle" font-size="10" fill="#f97316" letter-spacing="0.08em">REPO / DB</text>
  </g>

  <!-- Vertical lane separators -->
  <line x1="152" y1="70" x2="152" y2="450" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
  <line x1="292" y1="70" x2="292" y2="450" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
  <line x1="432" y1="70" x2="432" y2="450" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
  <line x1="572" y1="70" x2="572" y2="450" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>

  <!-- Step 1: HTTP Request -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <circle cx="85" cy="140" r="22" fill="#0a1a2e" stroke="#3df5ff" stroke-width="1.5" filter="url(#glow2)"/>
    <text x="85" y="136" text-anchor="middle" font-size="9" fill="#3df5ff">HTTP</text>
    <text x="85" y="148" text-anchor="middle" font-size="9" fill="#3df5ff">REQ</text>
  </g>

  <!-- Step 1 → 2 arrow -->
  <line x1="107" y1="140" x2="193" y2="140" stroke="#3df5ff" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr1)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1s" begin="1.1s" repeatCount="indefinite"/>
  </line>
  <text x="150" y="133" text-anchor="middle" font-size="9" fill="#555577" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.15s" fill="freeze"/>
    GET /api/questions
  </text>

  <!-- Step 2: JWT Filter -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <rect x="168" y="118" width="104" height="44" rx="8" fill="#1a1408" stroke="#ffca3a" stroke-width="1.5"/>
    <text x="220" y="136" text-anchor="middle" font-size="10" fill="#ffca3a">🔒 JWT</text>
    <text x="220" y="151" text-anchor="middle" font-size="9" fill="#998833">validateToken()</text>
  </g>

  <!-- Step 2 → 3 arrow -->
  <line x1="272" y1="140" x2="313" y2="140" stroke="#7effa0" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr2)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.45s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1s" begin="1.45s" repeatCount="indefinite"/>
  </line>
  <text x="292" y="133" text-anchor="middle" font-size="9" fill="#555577" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze"/>
    pass
  </text>

  <!-- Step 3: Controller -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/>
    <rect x="310" y="118" width="100" height="44" rx="8" fill="#0a1a0f" stroke="#7effa0" stroke-width="1.5"/>
    <text x="360" y="136" text-anchor="middle" font-size="10" fill="#7effa0">@RestCtrl</text>
    <text x="360" y="151" text-anchor="middle" font-size="9" fill="#448855">getQuestions()</text>
  </g>

  <!-- Step 3 → 4 arrow -->
  <line x1="410" y1="140" x2="453" y2="140" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr3)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.85s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1s" begin="1.85s" repeatCount="indefinite"/>
  </line>

  <!-- Step 4: Service -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.0s" fill="freeze"/>
    <rect x="450" y="118" width="104" height="44" rx="8" fill="#120a1f" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="502" y="136" text-anchor="middle" font-size="10" fill="#a78bfa">@Service</text>
    <text x="502" y="151" text-anchor="middle" font-size="9" fill="#7755aa">business logic</text>
  </g>

  <!-- Step 4 → 5 arrow -->
  <line x1="554" y1="140" x2="597" y2="140" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr1)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.25s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1s" begin="2.25s" repeatCount="indefinite"/>
  </line>

  <!-- Step 5: Repository -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.4s" fill="freeze"/>
    <rect x="594" y="118" width="106" height="44" rx="8" fill="#1a0a08" stroke="#f97316" stroke-width="1.5"/>
    <text x="647" y="136" text-anchor="middle" font-size="10" fill="#f97316">@Repository</text>
    <text x="647" y="151" text-anchor="middle" font-size="9" fill="#995522">JPA / SQL</text>
  </g>

  <!-- ── DB CALL DOWN ── -->
  <line x1="647" y1="162" x2="647" y2="218" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr1)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.65s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1s" begin="2.65s" repeatCount="indefinite"/>
  </line>

  <!-- DB node -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.8s" fill="freeze"/>
    <ellipse cx="647" cy="250" rx="52" ry="18" fill="#1a0a08" stroke="#f97316" stroke-width="1.5"/>
    <ellipse cx="647" cy="238" rx="52" ry="18" fill="#220d08" stroke="#f97316" stroke-width="1.5"/>
    <text x="647" y="242" text-anchor="middle" font-size="10" fill="#f97316">PostgreSQL</text>
  </g>

  <!-- ── RETURN PATH ── -->
  <!-- DB → Service (return) -->
  <path d="M594,245 Q540,260 500,230 Q500,210 500,195" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arr3)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.1s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="80" to="0" dur="1.2s" begin="3.1s" repeatCount="indefinite"/>
  </path>
  <text x="545" y="273" text-anchor="middle" font-size="9" fill="#554488" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.2s" fill="freeze"/>
    List&lt;Question&gt;
  </text>

  <!-- Service → Controller (return) -->
  <line x1="450" y1="185" x2="412" y2="185" stroke="#7effa0" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr2)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.4s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1.2s" begin="3.4s" repeatCount="indefinite"/>
  </line>

  <!-- Controller → Client (return) -->
  <line x1="310" y1="185" x2="108" y2="185" stroke="#3df5ff" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr1)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.7s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.2s" begin="3.7s" repeatCount="indefinite"/>
  </line>
  <text x="210" y="178" text-anchor="middle" font-size="9" fill="#336655" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.8s" fill="freeze"/>
    200 OK · JSON
  </text>

  <!-- Response node at client -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4.0s" fill="freeze"/>
    <circle cx="85" cy="185" r="22" fill="#0a2018" stroke="#7effa0" stroke-width="2" filter="url(#glow2)"/>
    <text x="85" y="181" text-anchor="middle" font-size="9" fill="#7effa0">JSON</text>
    <text x="85" y="193" text-anchor="middle" font-size="9" fill="#7effa0">RES</text>
  </g>

  <!-- ── EXCEPTION PATH ── -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="0.8" dur="0.5s" begin="4.3s" fill="freeze"/>
    <rect x="168" y="290" width="264" height="50" rx="8" fill="#1a0808" stroke="#ff4757" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="300" y="311" text-anchor="middle" font-size="10" fill="#ff4757">⚠ @ExceptionHandler</text>
    <text x="300" y="327" text-anchor="middle" font-size="9" fill="#993333">GlobalExceptionHandler · ErrorResponse</text>
  </g>
  <text x="300" y="278" text-anchor="middle" font-size="9" fill="#ff4757" opacity="0">
    <animate attributeName="opacity" from="0" to="0.7" dur="0.4s" begin="4.4s" fill="freeze"/>
    on error
  </text>
  <path d="M360,162 Q360,270 432,290" stroke="#ff4757" stroke-width="1" stroke-dasharray="3,2" fill="none" opacity="0">
    <animate attributeName="opacity" from="0" to="0.5" dur="0.4s" begin="4.4s" fill="freeze"/>
  </path>

  <!-- ── SWAGGER badge ── -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4.6s" fill="freeze"/>
    <rect x="290" y="380" width="220" height="46" rx="10" fill="#0d1a0d" stroke="#85ea2d" stroke-width="1.5"/>
    <text x="400" y="399" text-anchor="middle" font-size="11" fill="#85ea2d">📄 Swagger UI</text>
    <text x="400" y="415" text-anchor="middle" font-size="9" fill="#446622">/swagger-ui/index.html</text>
  </g>

  <!-- Footer -->
  <text x="400" y="463" text-anchor="middle" font-size="9" fill="#222240" letter-spacing="0.1em">SPRING BOOT 3.2 · JPA · JAKARTA VALIDATION · LOMBOK</text>
</svg>
