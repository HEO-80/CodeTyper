<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7effa0"/>
      <stop offset="100%" style="stop-color:#3df5ff"/>
    </linearGradient>
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757"/>
      <stop offset="100%" style="stop-color:#ff6b81"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7effa0"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff4757"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3df5ff"/>
    </marker>
    <style>
      .node-box { transition: all 0.3s; }
      .flow-label { font-size: 11px; fill: #8888aa; letter-spacing: 0.05em; }
      .node-title { font-size: 13px; font-weight: bold; }
      .node-sub { font-size: 10px; fill: #6b6b80; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bg)" rx="16"/>

  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.04"/>
  </pattern>
  <rect width="800" height="520" fill="url(#dots)" rx="16"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="url(#accentGrad)" filter="url(#glow)" letter-spacing="0.1em">JWT AUTH FLOW</text>
  <text x="400" y="58" text-anchor="middle" font-size="10" fill="#555570" letter-spacing="0.15em">QUIZAPP PRO · AUTHENTICATION SEQUENCE</text>
  <line x1="200" y1="66" x2="600" y2="66" stroke="#7effa0" stroke-width="0.5" opacity="0.3"/>

  <!-- ── NODE 1: CLIENT ── -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <rect x="60" y="90" width="140" height="60" rx="10" fill="url(#nodeGrad)" stroke="#7effa0" stroke-width="1.5" filter="url(#glow)"/>
    <text x="130" y="115" text-anchor="middle" class="node-title" fill="#7effa0">📱 CLIENT</text>
    <text x="130" y="133" text-anchor="middle" class="node-sub">Android App</text>
  </g>

  <!-- ── NODE 2: API ENDPOINT ── -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <rect x="320" y="90" width="160" height="60" rx="10" fill="url(#nodeGrad)" stroke="#3df5ff" stroke-width="1.5" filter="url(#glow)"/>
    <text x="400" y="111" text-anchor="middle" class="node-title" fill="#3df5ff">🌐 /api/auth</text>
    <text x="400" y="129" text-anchor="middle" class="node-sub">POST /login · POST /register</text>
  </g>

  <!-- ── NODE 3: SECURITY FILTER ── -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <rect x="580" y="90" width="160" height="60" rx="10" fill="url(#nodeGrad)" stroke="#ffca3a" stroke-width="1.5" filter="url(#glow)"/>
    <text x="660" y="111" text-anchor="middle" class="node-title" fill="#ffca3a">🔒 Security</text>
    <text x="660" y="129" text-anchor="middle" class="node-sub">Spring Security Filter</text>
  </g>

  <!-- ── NODE 4: USER SERVICE ── -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
    <rect x="580" y="220" width="160" height="60" rx="10" fill="url(#nodeGrad)" stroke="#7effa0" stroke-width="1.5"/>
    <text x="660" y="244" text-anchor="middle" class="node-title" fill="#7effa0">👤 UserService</text>
    <text x="660" y="262" text-anchor="middle" class="node-sub">loadUserByUsername</text>
  </g>

  <!-- ── NODE 5: DATABASE ── -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
    <rect x="580" y="350" width="160" height="60" rx="10" fill="url(#nodeGrad)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="660" y="374" text-anchor="middle" class="node-title" fill="#a78bfa">🗄️ PostgreSQL</text>
    <text x="660" y="392" text-anchor="middle" class="node-sub">users table</text>
  </g>

  <!-- ── NODE 6: JWT PROVIDER ── -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
    <rect x="300" y="350" width="180" height="60" rx="10" fill="url(#nodeGrad)" stroke="#3df5ff" stroke-width="1.5" filter="url(#glow)"/>
    <text x="390" y="374" text-anchor="middle" class="node-title" fill="#3df5ff">🔑 JWT Provider</text>
    <text x="390" y="392" text-anchor="middle" class="node-sub">generateToken · validateToken</text>
  </g>

  <!-- ── NODE 7: RESPONSE ── -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.0s" fill="freeze"/>
    <rect x="60" y="350" width="160" height="60" rx="10" fill="url(#nodeGrad)" stroke="#7effa0" stroke-width="2" filter="url(#softglow)"/>
    <text x="140" y="374" text-anchor="middle" class="node-title" fill="#7effa0">✅ JWT Token</text>
    <text x="140" y="392" text-anchor="middle" class="node-sub">Bearer token response</text>
  </g>

  <!-- ── ARROWS ── -->
  <!-- Client → Endpoint -->
  <line x1="200" y1="120" x2="318" y2="120" stroke="#7effa0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.65s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.5s" begin="0.65s" repeatCount="indefinite"/>
  </line>
  <text x="259" y="112" text-anchor="middle" class="flow-label" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.7s" fill="freeze"/>
    POST credentials
  </text>

  <!-- Endpoint → Security -->
  <line x1="480" y1="120" x2="578" y2="120" stroke="#3df5ff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.95s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.5s" begin="0.95s" repeatCount="indefinite"/>
  </line>

  <!-- Security → UserService -->
  <line x1="660" y1="150" x2="660" y2="218" stroke="#ffca3a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.25s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.5s" begin="1.25s" repeatCount="indefinite"/>
  </line>
  <text x="672" y="188" class="flow-label" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.3s" fill="freeze"/>
    validate
  </text>

  <!-- UserService → DB -->
  <line x1="660" y1="280" x2="660" y2="348" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.55s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.5s" begin="1.55s" repeatCount="indefinite"/>
  </line>
  <text x="672" y="318" class="flow-label" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.6s" fill="freeze"/>
    query
  </text>

  <!-- DB → JWT Provider -->
  <line x1="578" y1="380" x2="482" y2="380" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.85s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.5s" begin="1.85s" repeatCount="indefinite"/>
  </line>
  <text x="530" y="372" text-anchor="middle" class="flow-label" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.9s" fill="freeze"/>
    user found
  </text>

  <!-- JWT Provider → Client -->
  <line x1="298" y1="380" x2="222" y2="380" stroke="#3df5ff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.15s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.5s" begin="2.15s" repeatCount="indefinite"/>
  </line>
  <text x="260" y="372" text-anchor="middle" class="flow-label" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.2s" fill="freeze"/>
    sign token
  </text>

  <!-- 401 path from Security -->
  <path d="M580,105 Q520,85 400,85 Q280,85 220,110" stroke="#ff4757" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowRed)" opacity="0">
    <animate attributeName="opacity" from="0" to="0.7" dur="0.4s" begin="2.4s" fill="freeze"/>
  </path>
  <text x="400" y="78" text-anchor="middle" font-size="10" fill="#ff4757" opacity="0">
    <animate attributeName="opacity" from="0" to="0.7" dur="0.4s" begin="2.4s" fill="freeze"/>
    401 Unauthorized
  </text>

  <!-- Pulse on JWT token node -->
  <rect x="60" y="350" width="160" height="60" rx="10" fill="none" stroke="#7effa0" stroke-width="2" opacity="0">
    <animate attributeName="opacity" from="0.8" to="0" dur="1.5s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="width" from="160" to="185" dur="1.5s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="height" from="60" to="80" dur="1.5s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="x" from="60" to="47.5" dur="1.5s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="y" from="350" to="340" dur="1.5s" begin="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Footer -->
  <text x="400" y="495" text-anchor="middle" font-size="9" fill="#333350" letter-spacing="0.1em">SPRING SECURITY · JJWT 0.12 · STATELESS SESSION</text>
</svg>
